openapi: 3.1.0
info:
  title: inhology API
  version: 1.0.0
  description: >
    HTTP contract for the inhology backend (NestJS). A single-author personal
    blog: posts, tags, collections, and moderated comments.

    Auth: write/moderation endpoints require the internal shared admin token as
    an HTTP Bearer credential (`Authorization: Bearer <ADMIN_TOKEN>`). The API is
    cluster-internal and not publicly exposed; the web app is the only caller.

    Behaviour derived from the implementation — no global route prefix; global
    ValidationPipe with `whitelist` + `forbidNonWhitelisted` (unknown properties
    → 400) + `transform`.
  license:
    name: Private
servers:
  - url: http://localhost:4000
    description: Local development
  - url: https://inhology.jwih.org
    description: Production (cluster-internal; not publicly reachable)

tags:
  - name: meta
    description: Liveness / root.
  - name: posts
    description: Blog posts. Public reads are draft-aware when a valid admin token is sent.
  - name: comments
    description: Reader comments and author moderation.
  - name: tags
    description: The only grouping of posts — topic and collection labels.
  - name: collections
    description: Titled views over the posts, defined by tag rules.

security: []

paths:
  /:
    get:
      tags: [meta]
      summary: Root greeting
      operationId: getRoot
      responses:
        '200':
          description: Greeting string
          content:
            text/plain:
              schema:
                type: string
                example: Hello World!

  /health:
    get:
      tags: [meta]
      summary: Health check
      operationId: getHealth
      description: Runs `SELECT 1` against the database.
      responses:
        '200':
          description: Service healthy
          content:
            application/json:
              schema:
                type: object
                required: [status, db]
                properties:
                  status: { type: string, example: ok }
                  db: { type: string, example: up }

  /posts:
    get:
      tags: [posts]
      summary: List posts
      operationId: listPosts
      description: >
        Public callers see only PUBLISHED posts, newest first. An admin (valid
        Bearer token) sees all posts and may filter by `status`. Includes
        the `tags` relation (not `comments`).
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          description: Admin-only filter; ignored for anonymous callers.
          schema: { $ref: '#/components/schemas/PostStatus' }
        - name: tag
          in: query
          required: false
          description: Tag slug.
          schema: { type: string }
      responses:
        '200':
          description: Matching posts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Post' }
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      tags: [posts]
      summary: Create a post
      operationId: createPost
      description: >
        Slug is service-managed: a DRAFT is created with no slug; a PUBLISHED post
        gets a slug derived from its title, de-duplicated with a numeric suffix on
        collision. Also reused by the editor's draft autosave: the first autosave
        of a new post creates it as a DRAFT, after which autosave switches to updatePost.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePost' }
      responses:
        '201':
          description: Created post (with `tags`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Post' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /posts/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Post id. The GET operation also resolves by slug.
        schema: { type: string }
    get:
      tags: [posts]
      summary: Get one post
      operationId: getPost
      description: >
        Returns the post with its `tags` and its APPROVED
        `comments` (projected to public fields only). A non-published post is 404
        for anonymous callers; an admin (Bearer) may read drafts.
      security:
        - {}
        - bearerAuth: []
      responses:
        '200':
          description: The post
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [posts]
      summary: Update a post
      operationId: updatePost
      description: >
        Slug is service-managed by the resulting status: a PUBLISHED post's slug is
        (re)generated from its title and suffix-deduped on collision, so editing the
        title changes the slug; a DRAFT has its slug cleared to null. Also reused by
        the editor's draft autosave, which omits `status` so a save never changes the
        post's publication state. `publishedAt`, when sent, overwrites the publication
        date; when omitted the date is kept (and stamped with the current time on a
        first publish that has none).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdatePost' }
      responses:
        '200':
          description: Updated post (with `tags`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Post' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [posts]
      summary: Delete a post
      operationId: deletePost
      description: >
        Soft delete: marks the post deleted (sets `deletedAt`) and releases its
        slug for reuse. The post and its comments are hidden from every surface
        but retained in the database (recoverable there) — not a permanent erase.
      security:
        - bearerAuth: []
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /comments:
    post:
      tags: [comments]
      summary: Submit a comment
      operationId: createComment
      description: >
        Public. The target post must exist and be PUBLISHED (else 404). If
        `parentId` is given, the parent must belong to the same post (else 400).
        Always created PENDING; the response is projected to `{id,status,createdAt}`.
      responses:
        '201':
          description: Accepted, pending moderation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommentReceipt' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateComment' }
    get:
      tags: [comments]
      summary: List comments (moderation)
      operationId: listComments
      description: >
        Admin only. Full fields (incl. `authorEmail`, `status`) plus the owning
        post's `{title, slug}`. Newest first. Filterable by `status`/`postId`.
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/CommentStatus' }
        - name: postId
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Matching comments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CommentAdmin' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /comments/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [comments]
      summary: Moderate a comment
      operationId: moderateComment
      description: Set the comment's status (approve / spam / return to pending).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModerateComment' }
      responses:
        '200':
          description: Updated comment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Comment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [comments]
      summary: Delete a comment
      operationId: deleteComment
      description: Cascades to the comment's replies.
      security:
        - bearerAuth: []
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tags:
    get:
      tags: [tags]
      summary: List tags
      operationId: listTags
      description: >
        Every tag with `_count.posts` — the number of PUBLISHED, non-deleted posts
        carrying it — ordered by that count descending, then by name. Tags with a
        count of 0 are included (the editor suggests them); readers' surfaces skip
        them.
      responses:
        '200':
          description: All tags
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TagWithCount' }
    post:
      tags: [tags]
      summary: Create a tag
      operationId: createTag
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTag' }
      responses:
        '201':
          description: Created tag
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tag' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }

  /tags/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Tag id. The GET operation also resolves by slug.
        schema: { type: string }
    get:
      tags: [tags]
      summary: Get one tag
      operationId: getTag
      responses:
        '200':
          description: The tag (with `_count.posts`, published posts only)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TagWithCount' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [tags]
      summary: Update a tag
      operationId: updateTag
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateTag' }
      responses:
        '200':
          description: Updated tag
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tag' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [tags]
      summary: Delete a tag
      operationId: deleteTag
      description: Removes join rows only; posts are untouched.
      security:
        - bearerAuth: []
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /collections:
    get:
      tags: [collections]
      summary: List collections
      operationId: listCollections
      description: >
        Every collection in creation order, each with its rule `tags` and
        `postCount` — the number of PUBLISHED, non-deleted posts carrying every
        rule tag (all published posts when there are no rules).
      responses:
        '200':
          description: All collections
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Collection' }
    post:
      tags: [collections]
      summary: Create a collection
      operationId: createCollection
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCollection' }
      responses:
        '201':
          description: Created collection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Collection' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }

  /collections/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Collection id. The GET operation also resolves by slug.
        schema: { type: string }
    get:
      tags: [collections]
      summary: Get one collection
      operationId: getCollection
      description: >
        The collection with its rule `tags`, `postCount`, and its `posts`: the
        PUBLISHED posts satisfying every rule, newest first, each with `tags`.
      responses:
        '200':
          description: The collection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CollectionDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [collections]
      summary: Update a collection
      operationId: updateCollection
      description: Changing the title re-derives the slug. `rules`, when sent, replaces the whole rule set.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateCollection' }
      responses:
        '200':
          description: Updated collection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Collection' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [collections]
      summary: Delete a collection
      operationId: deleteCollection
      description: Removes the collection and its rules only; posts and tags are untouched.
      security:
        - bearerAuth: []
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "The internal shared `ADMIN_TOKEN`, sent as `Authorization: Bearer <token>`."

  responses:
    BadRequest:
      description: Validation error (unknown/invalid fields).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing or invalid admin token.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found (or a draft hidden from anonymous callers).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Constraint conflict (duplicate slug, or FK still in use).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    PostStatus:
      type: string
      enum: [DRAFT, PUBLISHED]
    CommentStatus:
      type: string
      enum: [PENDING, APPROVED, SPAM]

    Error:
      type: object
      description: Standard NestJS exception body.
      required: [statusCode, message]
      properties:
        statusCode: { type: integer, example: 404 }
        message:
          oneOf:
            - type: string
            - type: array
              items: { type: string }
          example: Post not found
        error: { type: string, example: Not Found }

    Tag:
      type: object
      required: [id, slug, name, createdAt]
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        createdAt: { type: string, format: date-time }
    TagWithCount:
      allOf:
        - $ref: '#/components/schemas/Tag'
        - type: object
          properties:
            _count:
              type: object
              properties:
                posts: { type: integer }

    Collection:
      type: object
      description: A titled view over the posts. `tags` are its rules.
      required: [id, slug, title, tags, postCount, createdAt, updatedAt]
      properties:
        id: { type: string }
        slug: { type: string }
        title: { type: string }
        description:
          type: [string, 'null']
        tags:
          type: array
          description: The rule tags; a post must carry every one. Empty means every post.
          items: { $ref: '#/components/schemas/Tag' }
        postCount:
          type: integer
          description: Published posts currently satisfying the rules.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CollectionDetail:
      allOf:
        - $ref: '#/components/schemas/Collection'
        - type: object
          properties:
            posts:
              type: array
              items: { $ref: '#/components/schemas/Post' }

    Post:
      type: object
      description: A post with its `tags`.
      required:
        [id, title, content, status, viewCount, createdAt, updatedAt, tags]
      properties:
        id: { type: string }
        slug:
          type: [string, 'null']
          description: null while the post is a draft; set (from the title, suffix-deduped) on publish.
        title: { type: string }
        excerpt:
          type: [string, 'null']
        content: { type: string, description: Markdown body }
        status: { $ref: '#/components/schemas/PostStatus' }
        publishedAt:
          type: [string, 'null']
          format: date-time
        readingTime:
          type: [integer, 'null']
        viewCount: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        deletedAt:
          type: [string, 'null']
          format: date-time
          description: Soft-delete marker; always null in responses (deleted posts are never returned).
        tags:
          type: array
          items: { $ref: '#/components/schemas/Tag' }
    PostDetail:
      allOf:
        - $ref: '#/components/schemas/Post'
        - type: object
          properties:
            comments:
              type: array
              description: APPROVED comments only, public projection.
              items: { $ref: '#/components/schemas/PublicComment' }

    Comment:
      type: object
      description: Full comment (moderation view).
      required: [id, content, authorName, status, postId, createdAt, updatedAt]
      properties:
        id: { type: string }
        content: { type: string }
        authorName: { type: string }
        authorEmail:
          type: [string, 'null']
          format: email
        status: { $ref: '#/components/schemas/CommentStatus' }
        postId: { type: string }
        parentId:
          type: [string, 'null']
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CommentAdmin:
      allOf:
        - $ref: '#/components/schemas/Comment'
        - type: object
          properties:
            post:
              type: object
              properties:
                title: { type: string }
                slug: { type: string }
    PublicComment:
      type: object
      description: Comment as shown to readers — no email, no status.
      required: [id, content, authorName, createdAt]
      properties:
        id: { type: string }
        content: { type: string }
        authorName: { type: string }
        createdAt: { type: string, format: date-time }
        parentId:
          type: [string, 'null']
    CommentReceipt:
      type: object
      description: Projection returned when a reader submits a comment.
      required: [id, status, createdAt]
      properties:
        id: { type: string }
        status: { $ref: '#/components/schemas/CommentStatus' }
        createdAt: { type: string, format: date-time }

    CreatePost:
      type: object
      required: [title, content]
      properties:
        title: { type: string, minLength: 1 }
        content: { type: string, minLength: 1, description: Markdown body }
        excerpt: { type: string }
        status: { $ref: '#/components/schemas/PostStatus' }
        tags:
          type: array
          items: { type: string, minLength: 1 }
          description: >
            Tag names. Each is matched to an existing tag by name
            (case-insensitive) or slug, or created. Omitted means no tags.
    UpdatePost:
      type: object
      description: >
        All CreatePost fields, each optional (PATCH semantics), plus the
        author-editable `publishedAt`.
      properties:
        title: { type: string, minLength: 1 }
        content: { type: string, minLength: 1 }
        excerpt: { type: string }
        status: { $ref: '#/components/schemas/PostStatus' }
        tags:
          type: array
          items: { type: string, minLength: 1 }
          description: >
            Tag names. Each is matched to an existing tag by name
            (case-insensitive) or slug, or created. Replaces the post's whole tag set; omit to keep it.
        publishedAt:
          type: string
          format: date-time
          description: Overwrites the publication date. Omit to keep the current one.

    CreateComment:
      type: object
      required: [postId, content, authorName]
      properties:
        postId: { type: string }
        content: { type: string, minLength: 1, maxLength: 5000 }
        authorName: { type: string, minLength: 1, maxLength: 50 }
        authorEmail: { type: string, format: email, description: Optional; never exposed publicly. }
        parentId: { type: string, description: Reply target; must belong to the same post. }
    ModerateComment:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/CommentStatus' }

    CreateCollection:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1 }
        description: { type: string }
        rules:
          type: array
          items: { type: string, minLength: 1 }
          description: Tag names, matched or created like a post's tags. Omitted means no rules.
    UpdateCollection:
      type: object
      properties:
        title: { type: string, minLength: 1 }
        description:
          type: [string, 'null']
          description: null clears the description.
        rules:
          type: array
          items: { type: string, minLength: 1 }
          description: Replaces the whole rule set; omit to keep it.
    CreateTag:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        slug: { type: string }
    UpdateTag:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        slug: { type: string }
